include:
  # Dify mantiene su Compose oficial en su propio repositorio y directorio.
  # Consulte README.md para clonar el repositorio y crear su archivo .env.
  #- path: ./dify/docker/docker-compose.yaml
  #  project_directory: ./dify/docker

services:
  regression-api:
    build: .
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      FLASK_HOST: 0.0.0.0
      API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD:?Set API_ADMIN_PASSWORD in .env}
      API_TOKEN_SECRET: ${API_TOKEN_SECRET:?Set API_TOKEN_SECRET in .env}
      API_TOKEN_TTL_SECONDS: ${API_TOKEN_TTL_SECONDS:-3600}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    volumes:
      - regression_runs:/app/runs
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama:/root/.ollama
    ports:
      # Disponible localmente para los contenedores de Dify y herramientas del host.
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL_LLAMA3: ${OLLAMA_MODEL_LLAMA3:-llama3:8b}
      OLLAMA_MODEL_MISTRAL: ${OLLAMA_MODEL_MISTRAL:-mistral:7b}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      ollama pull "$${OLLAMA_MODEL_LLAMA3}" &&
      ollama pull "$${OLLAMA_MODEL_MISTRAL}" &&
      ollama pull "$${OLLAMA_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}/
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
      TZ: ${GENERIC_TIMEZONE:-Europe/Paris}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  flowise:
    # Flowise 3.1.4 tiene un fallo de dependencias al inicializar nodos opcionales.
    # 3.1.3 es la última etiqueta anterior a ese fallo que arranca correctamente.
    image: ${FLOWISE_IMAGE:-flowiseai/flowise:3.1.3}
    ports:
      - "127.0.0.1:${FLOWISE_PORT:-3001}:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /home/node/.flowise
      APIKEY_PATH: /home/node/.flowise
      LOG_PATH: /home/node/.flowise/logs
      SECRETKEY_PATH: /home/node/.flowise
      BLOB_STORAGE_PATH: /home/node/.flowise/storage
      SECRETKEY_STORAGE_TYPE: local
      STORAGE_TYPE: local
    volumes:
      - flowise_data:/home/node/.flowise
    depends_on:
      ollama:
        condition: service_healthy
      flowise-data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Flowise ejecuta como usuario node (UID 1000). Este paso prepara el volumen
  # compartido para que pueda crear la base SQLite, claves, logs y ficheros.
  flowise-data-init:
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - flowise_data:/data
    restart: "no"

volumes:
  regression_runs:
  n8n_data:
  flowise_data:

